---

# You shouldn't need to edit this file.
# You can adjust the configuration using environment variables.

# The URL for Keycloak
keycloak_server_url: "https://{{ lookup('env', 'IM_DEV_AUTH_HOSTNAME') | default('squonk.informaticsmatters.org', True) }}/auth"

# The hostname of the cluster,
# Change this and the other addresses for your cluster.
ui_hostname: "{{ lookup('env', 'IM_DEV_K8S_HOSTNAME') | default('kubernetes.docker.internal', True) }}"

ui_data_manager_api_address: "{{ lookup('env', 'IM_DEV_K8S_HOSTNAME') | default('kubernetes.docker.internal', True) }}/data-manager-api"
ui_account_server_api_address: "{{ lookup('env', 'IM_DEV_K8S_HOSTNAME') | default('kubernetes.docker.internal', True) }}/account-server-api"

ui_keycloak_client_id: SetMe
ui_keycloak_client_secret: SetMe

# You shouldn't need to change these...
ui_namespace: data-manager-ui
ui_image_tag: latest
ui_disable_ssl_cert_check: yes

# The KUBECONFIG reference.
# Used outside of AWX to set kubernetes credentials.
ui_kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
