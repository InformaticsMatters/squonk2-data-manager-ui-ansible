---

# Where are we deploying this stuff?
#
# The name is used to decrypt installation-specific variables
# that are expected to be found in 'vars/installation-<name>.vault'.
# You are required to provide the vault password for the selected installation.
ui_installation_name: local

# A set of parameters for local deployment (Rancher Desktop and the like).
# You will need to define: -
#
# - IM_DEV_UI_CLIENT_SECRET
#
# This can also be tuned with some extra material via the following
# environment variables: -
#
# - IM_DEV_UI_IMAGE_TAG
# - IM_DEV_AUTH_HOSTNAME

ui_kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"

keycloak_server_url: "https://{{ lookup('env', 'IM_DEV_AUTH_HOSTNAME') | default('squonk.informaticsmatters.org', True) }}/auth"

ui_hostname: squonk2
ui_data_manager_api_address: squonk2/data-manager-api
ui_account_server_api_address: squonk2/account-server-api

ui_keycloak_client_id: data-manager-ui-local
ui_keycloak_client_secret: "{{ lookup('env', 'IM_DEV_UI_CLIENT_SECRET') | default('SetMe', True) }}"

ui_namespace: im-data-manager-ui
ui_image_tag: "{{ lookup('env', 'IM_DEV_UI_IMAGE_TAG') | default('5.4.0', True)}}"
ui_disable_ssl_cert_check: yes

ui_priority_class: im-application-high
